CLW_ClearRules {
 m_bEnabled 1
 m_bRequireReplicated 1
 m_fMaxRadiusM 3
 m_fMaxHeightM 8
 m_iMaxPerSpot 60
 m_aNeverPathContains {
  "/houses/"
  "/buildings/"
  "/structures/military"
  "bridge"
  "/roads/"
  "road_"
  "powerline"
  "pole"
  "antenna"
  "tower"
  "church"
  "wreck"
  "/vehicles/"
 }
 m_aNeverClassNames {
  "building"
  "genericterrainentity"
 }
 m_aRules {
  CLW_ClearRule {
   m_sKind "vegetation"
   m_bAnyTree 1
   m_aPathContains {
    "/vegetation/"
   }
   m_fMaxRadiusM 6
  }
  CLW_ClearRule {
   m_sKind "fence"
   m_aPathContains {
    "fence"
    "/walls/"
    "wall_"
   }
   m_fMaxRadiusM 5
  }
  CLW_ClearRule {
   m_sKind "clutter"
   m_aPathContains {
    "clutter"
    "/debris/"
    "rubble"
    "/trash"
   }
   m_fMaxRadiusM 2
  }
  CLW_ClearRule {
   m_sKind "prop"
   m_aPathContains {
    "/props/"
   }
  }
 }
}
