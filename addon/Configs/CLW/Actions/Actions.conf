   m_sAuthority "hq"
   m_sDescription "Establish a forward operating base (FOB) at a candidate site: pays the FOB cost, a transport with an escort drives out and builds it. A FOB gives a spawn point, a command post, a supply cache and an arsenal near the front. Only one FOB may be in progress per side, max war.mode.params.fobMax per side. Choose a site from fobSites; check fobRules for the cost and your supplies."
